<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Raunak Dummy YouTube</title>
    <link rel="stylesheet" href="login.css">
    <link
        rel="icon"
        type="image/png"
        href="https://www.freepnglogos.com/uploads/youtube-logo-png/youtube-transparent-youtube-icon-download-clipart-with-transparent-25.png">
</head>

<body>
    <main class="login-page">
        <section class="login-card" aria-labelledby="loginTitle">
            <a class="brand" href="/" aria-label="Return to home">
                <span class="brand-icon">▶</span>
                <span>Raunak Dummy YouTube</span>
            </a>

            <h1 id="loginTitle">Sign in</h1>
            <p class="login-subtitle">Continue to your RTube account</p>

            <form id="loginForm" novalidate>
                <label for="username">Username</label>
                <input
                    id="username"
                    name="username"
                    type="text"
                    autocomplete="username"
                    placeholder="Enter your username"
                    required
                >

                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        required
                    >
                    <button id="togglePassword" type="button" aria-label="Show password">Show</button>
                </div>

                <p id="loginMessage" class="message" role="alert" aria-live="polite"></p>

                <button id="loginButton" class="login-button" type="submit">
                    Sign in
                </button>
            </form>

            <p class="back-link">
                <a href="/">← Back to home</a>
            </p>
        </section>
    </main>

    <script src="login.js"></script>
</body>

</html>
