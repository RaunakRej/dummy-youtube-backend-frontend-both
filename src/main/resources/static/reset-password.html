<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Reset password - Raunak Dummy YouTube</title>
    <link rel="stylesheet" href="login.css">
    <link rel="icon" type="image/svg+xml" href="/youtube-icon.svg">
</head>

<body>
    <main class="login-page">
        <section class="login-card" aria-labelledby="resetTitle">
            <a class="brand" href="/" aria-label="Return to home">
                <span class="brand-icon">▶</span>
                <span>Raunak Dummy YouTube</span>
            </a>

            <h1 id="resetTitle">Reset your password</h1>
            <p id="resetSubtitle" class="login-subtitle">
                Enter your account email and we’ll send you a password reset link.
            </p>

            <form id="requestResetForm" novalidate>
                <label for="resetEmail">Email</label>
                <input id="resetEmail" name="email" type="email"
                    autocomplete="email" placeholder="Enter your account email"
                    maxlength="254" required>
                <p id="resetRequestMessage" class="message" role="alert" aria-live="polite"></p>
                <button id="requestResetButton" class="login-button" type="submit">
                    Send reset link
                </button>
            </form>

            <form id="confirmResetForm" novalidate hidden>
                <label for="newPassword">New password</label>
                <input id="newPassword" name="newPassword" type="password"
                    autocomplete="new-password" placeholder="Enter a new password"
                    minlength="8" maxlength="72" required>

                <label for="confirmNewPassword">Confirm new password</label>
                <input id="confirmNewPassword" name="confirmNewPassword" type="password"
                    autocomplete="new-password" placeholder="Enter the new password again"
                    minlength="8" maxlength="72" required>

                <p id="resetConfirmMessage" class="message" role="alert" aria-live="polite"></p>
                <button id="confirmResetButton" class="login-button" type="submit">
                    Reset password
                </button>
            </form>

            <p id="resetCompleteMessage" class="message success-message" role="status" hidden></p>

            <p id="resetBackLink" class="back-link">
                <a href="/login">Back to sign in</a>
            </p>
        </section>
    </main>

    <script src="reset-password.js?v=20261022-password-reset"></script>
</body>

</html>
